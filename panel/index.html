<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyouji Relay | Node Active</title>
    <style>
        :root { --bg: #0d0f12; --accent: #00ffcc; --text: #e0e6ed; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { text-align: center; background: rgba(20, 24, 30, 0.8); padding: 40px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0, 255, 204, 0.1); border: 1px solid rgba(0, 255, 204, 0.2); backdrop-filter: blur(10px); opacity: 0; animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .status { font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .dot { width: 8px; height: 8px; background-color: var(--accent); border-radius: 50%; box-shadow: 0 0 10px var(--accent); animation: pulse 1.5s infinite; }
        h1 { font-size: 2.5rem; font-weight: 300; margin-bottom: 15px; }
        p { font-size: 1rem; color: #8a94a5; }
        @keyframes fadeUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="status"><div class="dot"></div> System Online</div>
        <h1>Kyouji Multiplex</h1>
        <p>Layer 7 Routing Engine is operational.</p>
    </div>
</body>
</html>
