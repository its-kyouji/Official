[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=root
environment=PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

[program:xray]
command=/usr/local/bin/xray run -confdir /etc/xray/conf
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:singbox]
command=/usr/local/bin/sing-box run -C /etc/singbox/conf
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:dropbear]
command=sh -c "exec /usr/local/sbin/dropbear $(cat /app/core/dropbear/dropbear.args)"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:openssh]
command=/usr/sbin/sshd -D -e -f /app/core/openssh/sshd_config
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:badvpn]
command=/usr/local/bin/badvpn-udpgw --listen-addr 127.0.0.1:7300 --loglevel warning --max-clients 1000 --max-connections-for-client 2048
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:bridge_ssh_dropbear]
command=/app/custom-tools/wait-for.sh 127.0.0.1:2200 -- python3 /run/cfg/relay/bridge.py /run/cfg/relay/bridge-ssh-dropbear.json
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:bridge_ssh_openssh]
command=/app/custom-tools/wait-for.sh 127.0.0.1:2201 -- python3 /run/cfg/relay/bridge.py /run/cfg/relay/bridge-ssh-openssh.json
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:bridge_ovpn]
command=python3 /run/cfg/relay/bridge.py /run/cfg/relay/bridge-ovpn.json
autostart=true
autorestart=unexpected
startsecs=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:caddy]
command=/app/custom-tools/wait-for.sh 127.0.0.1:10001 127.0.0.1:11001 -- caddy run --config /run/cfg/connector/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=/app/custom-tools/wait-for.sh 127.0.0.1:10001 127.0.0.1:11001 -- nginx -c /run/cfg/connector/nginx/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:haproxy]
command=/app/custom-tools/wait-for.sh 127.0.0.1:8083 127.0.0.1:8084 -- haproxy -f /run/cfg/connector/haproxy/haproxy.cfg -db
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:envoy]
command=/app/custom-tools/wait-for.sh 127.0.0.1:8082 -- envoy -c /run/cfg/connector/envoy/envoy.yaml --concurrency 2
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:fortress]
command=/app/custom-tools/wait-for.sh 127.0.0.1:8081 -- python3 /run/cfg/relay/fortress.py
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
