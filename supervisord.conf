; ==== SUPERVISORD.CONF ====
; Handles sequential boot via priority and active port polling.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:render]
command=python3 /app/render/render.py
autorestart=false
startretries=0
priority=1

[program:xray]
command=/bin/bash -c "if [ \"$CORES\" != \"singbox\" ]; then exec /usr/local/bin/xray run -config /etc/xray/config.json; fi"
autostart=true
autorestart=true
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:singbox]
command=/bin/bash -c "if [ \"$CORES\" = \"singbox\" ] || [ \"$CORES\" = \"xray,singbox\" ]; then exec /usr/local/bin/sing-box run -c /etc/singbox/config.json; fi"
autostart=true
autorestart=true
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ssh_backend]
command=/bin/bash -c "if [ \"$SSH_STACK\" = \"dropbear\" ]; then exec dropbear -F -E -R -p 127.0.0.1:2200 -K 60; elif [ \"$SSH_STACK\" = \"openssh\" ]; then exec /usr/sbin/sshd -D -p 2200; fi"
autostart=true
autorestart=true
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:bridges]
command=/bin/bash -c "python3 /app/edge/bridge.py"
autostart=true
autorestart=true
priority=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:cert_server]
command=/bin/bash -c "if [ -n \"$OVPN_UPSTREAM\" ]; then exec python3 /app/edge/cert_server.py; fi"
autostart=true
autorestart=true
priority=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:caddy]
command=/bin/bash -c "while ! nc -z 127.0.0.1 10001 2>/dev/null; do sleep 0.5; done; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=/bin/bash -c "while ! nc -z 127.0.0.1 10000 2>/dev/null; do sleep 0.5; done; exec nginx -g 'daemon off;'"
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:haproxy]
command=/bin/bash -c "while ! nc -z 127.0.0.1 8083 2>/dev/null; do sleep 0.5; done; exec haproxy -f /etc/haproxy/haproxy.cfg -db"
autostart=true
autorestart=true
priority=6
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:envoy]
command=/bin/bash -c "while ! nc -z 127.0.0.1 8082 2>/dev/null; do sleep 0.5; done; exec envoy -c /etc/envoy/envoy.yaml"
autostart=true
autorestart=true
priority=7
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:fortress]
command=/bin/bash -c "while ! nc -z 127.0.0.1 8081 2>/dev/null; do sleep 0.5; done; exec python3 /app/edge/fortress.py"
autostart=true
autorestart=true
priority=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
