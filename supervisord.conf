; ==============================================================================
; SUPERVISORD CONFIGURATION — Process Supervision & Startup Order
; ==============================================================================
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:xray]
command=/usr/local/bin/xray run -config /etc/xray/config.json
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:singbox]
command=/usr/local/bin/sing-box run -c /etc/singbox/config.json
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dropbear]
command=dropbear -F -E -R -p 127.0.0.1:2200 -b /etc/dropbear/banner.txt -K 60
autostart=true
autorestart=true
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:openssh]
command=/usr/sbin/sshd -D -p 2201
autostart=true
autorestart=true
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:udpgw]
command=badvpn-udpgw --listen-addr 127.0.0.1:7300 --max-clients 1000 --max-connections-for-client 1024 --loglevel warning
autostart=true
autorestart=true
priority=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:bridge_ssh]
command=python3 /app/relay/bridge.py 2222 127.0.0.1 2200 ssh
autostart=true
autorestart=true
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:bridge_ovpn]
command=python3 /app/relay/bridge.py 2223 127.0.0.1 1194 ovpn
autostart=true
autorestart=true
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:cert_server]
command=python3 /app/relay/cert_server.py
autostart=true
autorestart=true
priority=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
priority=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:haproxy]
command=haproxy -f /etc/haproxy/haproxy.cfg -db
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:envoy]
command=envoy -c /etc/envoy/envoy.yaml
autostart=true
autorestart=true
priority=6
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:fortress]
command=python3 /app/relay/fortress.py
autostart=true
autorestart=true
priority=7
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
