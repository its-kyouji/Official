global
    maxconn 65535
    log stdout format raw local0

defaults
    mode http
    timeout connect 10s
    timeout client  3600s
    timeout server  3600s
    timeout tunnel  3600s
    option httplog

frontend main
    bind 127.0.0.1:8082
    acl is_health path /health
    http-request return status 200 content-type "text/plain" string "OK" if is_health

    # Route XHTTP to Caddy, WS/HU to Nginx, gRPC direct, SSH/OVPN to bridges
    acl path_xh path_reg -i -E \-xh$
    acl path_grpc path_reg -i -E \-grpc$
    acl path_ssh path_reg -i -E \-ssh\-
    acl path_ovpn path_reg -i -E \-ovpn\-

    use_backend bk_caddy if path_xh
    use_backend bk_nginx if path_grpc
    use_backend bk_nginx if path_ssh
    use_backend bk_nginx if path_ovpn
    default_backend bk_nginx

backend bk_nginx
    server s1 127.0.0.1:8083

backend bk_caddy
    server s1 127.0.0.1:8084
