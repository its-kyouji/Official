worker_processes auto;
worker_rlimit_nofile 16384;
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}
http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8083 backlog=4096;
        server_name _;

        location = /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # Dynamic routing for Xray (10001-10016), Sing-box (11001-11012), and Bridges (2222-2223)
        location ~ ^/relay/.+$ {
            proxy_pass http://127.0.0.1:10001; # Dynamically routed or mapped to respective loopback
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_socket_keepalive on;
        }

        location / {
            root /app/panel;
            index index.html;
        }
    }
}
