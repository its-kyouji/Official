worker_processes auto;
worker_rlimit_nofile 16384;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/stderr warn;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 3600s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # 16 inbounds for Xray (10001+), 6 for Sing-box (11001+), 2 for Bridges
    map $uri $backend_port {
        ~PATH_PLACEHOLDER-x-vless-ws$   10001;
        ~PATH_PLACEHOLDER-x-vless-hu$   10002;
        ~PATH_PLACEHOLDER-x-vmess-ws$   10005;
        ~PATH_PLACEHOLDER-x-vmess-hu$   10006;
        ~PATH_PLACEHOLDER-x-trojan-ws$  10009;
        ~PATH_PLACEHOLDER-x-trojan-hu$  10010;
        ~PATH_PLACEHOLDER-x-ss-ws$      10013;
        ~PATH_PLACEHOLDER-x-ss-hu$      10014;
        
        ~PATH_PLACEHOLDER-s-vless-ws$   11001;
        ~PATH_PLACEHOLDER-s-vless-hu$   11002;
        ~PATH_PLACEHOLDER-s-vmess-ws$   11004;
        ~PATH_PLACEHOLDER-s-vmess-hu$   11005;
        ~PATH_PLACEHOLDER-s-trojan-ws$  11007;
        ~PATH_PLACEHOLDER-s-trojan-hu$  11008;
        
        ~PATH_PLACEHOLDER-ssh-(ws|hu)$  2222;
        ~PATH_PLACEHOLDER-ovpn-(ws|hu)$ 2223;
    }

    server {
        listen 8083 backlog=4096;
        server_name _;

        set_real_ip_from 127.0.0.1;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        location = /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        location = /runtime.json {
            alias /etc/xray/runtime.json;
            add_header Content-Type application/json;
        }

        location ~ ^PREFIX_PLACEHOLDER/ {
            if ($backend_port = "") { return 404; }
            
            proxy_pass http://127.0.0.1:$backend_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_buffering off;
            proxy_buffer_size 8k;
            proxy_buffers 4 16k;
            proxy_request_buffering off;
            
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_socket_keepalive on;
        }

        location / {
            root /app/panel;
            index index.html;
            try_files $uri $uri/ =404;
        }
    }
}
