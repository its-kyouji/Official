# ==============================================================================
# NGINX CORE SETTINGS
# ==============================================================================
worker_processes auto;
worker_rlimit_nofile 16384;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # ==========================================================================
    # LOGGING & OS OPTIMIZATIONS
    # ==========================================================================
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ==========================================================================
    # PROTOCOL UPGRADE MAPPING
    # ==========================================================================
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ==========================================================================
    # MULTIPLEXING ROUTE MAP (Xray, Sing-box, Bridges)
    # ==========================================================================
    map $uri $backend_port {
        ~-x-vless-ws$   10001;
        ~-x-vless-hu$   10002;
        ~-x-vmess-ws$   10005;
        ~-x-vmess-hu$   10006;
        ~-x-trojan-ws$  10009;
        ~-x-trojan-hu$  10010;
        ~-x-ss-ws$      10013;
        ~-x-ss-hu$      10014;
        
        ~-s-vless-ws$   11001;
        ~-s-vless-hu$   11002;
        ~-s-vmess-ws$   11004;
        ~-s-vmess-hu$   11005;
        ~-s-trojan-ws$  11007;
        ~-s-trojan-hu$  11008;
        ~-s-ss-ws$      11010;
        ~-s-ss-hu$      11011;
        
        ~-ssh-(ws|hu)$  2222;
        ~-ovpn-(ws|hu)$ 2223;
    }

    server {
        listen 8083 backlog=4096;
        server_name _;

        # ======================================================================
        # CLIENT IP RESTORATION (Via Fortress)
        # ======================================================================
        set_real_ip_from 127.0.0.1;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # ======================================================================
        # HEALTH CHECK PROBE
        # ======================================================================
        location = /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # ======================================================================
        # DYNAMIC TUNNEL INGRESS (Multiplexed)
        # ======================================================================
        location ~ ^/relay/ {
            if ($backend_port = "") { return 404; }
            
            proxy_pass http://127.0.0.1:$backend_port;
            proxy_http_version 1.1;
            
            # Header Forwarding
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Stream Buffering Bypass & Socket Tuning (From Gojo-Relay)
            proxy_buffering off;
            proxy_buffer_size 8k;
            proxy_buffers 4 16k;
            proxy_request_buffering off;
            
            # Persistent Session Timeouts
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_socket_keepalive on;
        }

        # ======================================================================
        # FRONTEND WEB PANEL ROOT
        # ======================================================================
        location / {
            root /app/panel;
            index index.html;
        }
    }
}
