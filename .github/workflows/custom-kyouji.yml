name: Build and Push — Official Relay

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # In-update na validation: Ii-scan lahat ng modular JSON configs
      - name: Validate Modular JSONC Configs
        run: |
          python3 -c "
          import json, re, os, glob
          
          # Hanapin lahat ng .json sa loob ng core/ directory
          files = glob.glob('core/**/*.json', recursive=True)
          
          for path in files:
              s = open(path).read()
              # Tanggalin ang JSONC comments (// at /* */)
              s = re.sub(r'(\"(?:\\\\.|[^\"\\\\])*\")|//.*?$|/\*.*?\*/', lambda m: m.group(1) if m.group(1) else '', s, flags=re.MULTILINE|re.DOTALL)
              
              try:
                  json.loads(s)
                  print(f'✅ {path} syntax OK')
              except json.JSONDecodeError as e:
                  print(f'❌ SYNTAX ERROR sa {path}: {e}')
                  exit(1)
          "

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kyouji:latest
            ${{ secrets.DOCKER_USERNAME }}/kyouji:${{ github.sha }}
