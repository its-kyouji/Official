name: Build and Push — Official Relay

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Validate JSONC syntax to prevent broken builds
      - name: Validate JSONC Configs
        run: |
          python3 -c "
          import json, re, os
          for path in ['core/xray/config.json.template', 'core/singbox/config.json.template']:
              if not os.path.exists(path): continue
              s = open(path).read()
              s = re.sub(r'(\"(?:\\\\.|[^\"\\\\])*\")|//.*?$|/\*.*?\*/', lambda m: m.group(1) if m.group(1) else '', s, flags=re.MULTILINE|re.DOTALL)
              json.loads(s)
              print(f'✅ {path} syntax OK')
          "

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kyouji:latest
            ${{ secrets.DOCKER_USERNAME }}/kyouji:${{ github.sha }}
