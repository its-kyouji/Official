# ==== BUILD.YML ====
name: Build and Publish Official Relay

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Core Python Syntax
        run: |
          python3 -m py_compile render/render.py
          python3 -m py_compile edge/fortress.py
          python3 -m py_compile edge/bridge.py
          python3 -m py_compile edge/cert_server.py

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/kyouji:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/kyouji:${{ github.sha }}
